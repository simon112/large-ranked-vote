<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New ranked poll</title>
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e2dd; --accent:#3a6df0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151515; --card:#1f1f1f; --ink:#ececea; --muted:#9a9a94; --line:#333; --accent:#7aa0ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  input, textarea { width:100%; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  textarea { min-height:180px; }
  .hint { color:var(--muted); font-size:.9rem; margin-top:4px; }
  button { margin-top:20px; font:inherit; font-weight:600; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; cursor:pointer; }
  .err { color:#d33; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>New ranked poll</h1>
  <form id="f">
    <label for="title">Question</label>
    <input id="title" required maxlength="200" placeholder="Where should we eat on Friday?">
    <label for="opts">Options</label>
    <textarea id="opts" required placeholder="One per line"></textarea>
    <div class="hint">One option per line. Everyone drags them into their order; scored by Borda count.</div>
    <button type="submit">Create poll</button>
    <div class="err" id="err"></div>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const options = document.getElementById('opts').value.split('\n').map(s => s.trim()).filter(Boolean);
  const res = await fetch('/api/polls', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ title: document.getElementById('title').value, options }) });
  const data = await res.json();
  if (!res.ok) { document.getElementById('err').textContent = data.error; return; }
  location.href = '/p/' + data.id;
});
</script>
</body>
</html>
